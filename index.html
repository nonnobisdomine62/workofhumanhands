<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work of Human Hands - A Theological Critique of the Mass of Paul VI</title>
<meta name="description" content="Full text of Work of Human Hands by Rev. Anthony Cekada (2nd ed., SGG Resources, 2015), with search and dark and light themes.">
<style>
:root{
  --paper:#faf7f0; --ink:#23201a; --muted:#5d564a;
  --accent:#8c2f24; --accent-visited:#6d231b;
  --rule:#948a72; --hit:#f3e2c0; --sel:#eedfb8;
}
html.dark{
  --paper:#171512; --ink:#e9e4d8; --muted:#a89f8d;
  --accent:#d4796a; --accent-visited:#e09a8e;
  --rule:#7a735f; --hit:#5a4632; --sel:#4d3d2a;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:Georgia,'Times New Roman',Times,serif;
  font-size:1.0625rem; line-height:1.7;
}
a[href],button,summary,label[for]{cursor:pointer}
:disabled{cursor:not-allowed}
a{color:var(--accent);text-decoration:none}
a:visited{color:var(--accent-visited)}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.skip{
  position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--paper);
  padding:.5rem 1rem;z-index:50;
}
.skip:focus{left:0}

/* header */
header.site{
  display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;
  padding:.6rem 1rem;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--paper);z-index:20;
}
header.site .brand{
  font-variant:small-caps;letter-spacing:.04em;font-weight:bold;
  font-size:1.05rem;margin-right:auto;
}
header.site .brand a{color:var(--ink)}
#menuBtn,#themeBtn,#searchBtn,#tocClose{
  font:inherit;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
  padding:.4rem .8rem;min-height:44px;min-width:44px;
  border-radius:8px;cursor:pointer;
  transition:background-color .15s ease,border-color .15s ease,box-shadow .15s ease,transform .06s ease;
}
#menuBtn:hover,#themeBtn:hover,#searchBtn:hover,#tocClose:hover{
  border-color:var(--muted);background:var(--sel);
}
#menuBtn:focus-visible,#themeBtn:focus-visible,#searchBtn:focus-visible,#tocClose:focus-visible,
#q:focus-visible,nav.toc a:focus-visible,.hitbox a:focus-visible,#startLink:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
#menuBtn:active,#themeBtn:active,#searchBtn:active,#tocClose:active{transform:translateY(1px)}
#themeBtn[aria-pressed="true"]{font-weight:bold}
.searchwrap{flex:1 1 14rem;display:flex;min-width:0}
.searchwrap:focus-within #q{border-color:var(--muted)}
.searchwrap:focus-within #searchBtn{border-color:var(--muted)}
#q{
  flex:1;min-width:0;font:inherit;padding:.45rem .7rem;min-height:44px;
  border:1px solid var(--rule);border-right:none;background:var(--paper);color:var(--ink);
  border-radius:8px 0 0 8px;
}
#q:focus{border-color:var(--muted)}
#searchBtn{
  font:inherit;border:1px solid var(--rule);background:var(--paper);color:var(--ink);
  padding:.45rem .9rem;min-height:44px;border-radius:0 8px 8px 0;cursor:pointer;
}
#searchBtn:hover{border-color:var(--muted);background:var(--sel)}

/* layout */
.layout{display:flex;min-height:calc(100vh - 4rem)}
nav.toc{
  width:17rem;flex:0 0 17rem;border-right:1px solid var(--rule);
  padding:1rem;overflow-y:auto;max-height:calc(100vh - 4rem);
  position:sticky;top:4rem;align-self:flex-start;
}
nav.toc ol{list-style:none;margin:0;padding:0}
nav.toc li{margin:.15rem 0}
nav.toc a{
  display:flex;align-items:center;gap:.5rem;
  padding:.4rem .55rem;color:var(--ink);border-radius:6px;
  min-height:44px;position:relative;
  transition:background-color .12s ease;
}
nav.toc a::before{
  content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;
  border-radius:3px;background:transparent;transition:background-color .12s ease;
}
nav.toc a:hover{background:var(--sel);text-decoration:none}
nav.toc a.active{color:var(--accent);font-weight:bold;background:var(--sel)}
nav.toc a.active::before{background:var(--accent)}
nav.toc .kind{font-size:.78rem;color:var(--muted);display:block}
main{flex:1;min-width:0;padding:1.5rem 1.25rem 4rem}
.chapter{max-width:40rem;margin:0 auto}
.chapter .kicker{font-variant:small-caps;letter-spacing:.08em;color:var(--muted);margin:0 0 .3rem}
h1.chaptitle{
  font-size:1.6rem;line-height:1.3;font-weight:bold;margin:0 0 1.6rem;
  font-variant:small-caps;letter-spacing:.02em;
}
h3.sec{
  font-size:1.02rem;letter-spacing:.06em;font-variant:small-caps;
  margin:2.2rem 0 .8rem;font-weight:bold;
}
p{margin:0 0 1.1rem;text-align:left}
.quote{
  margin:1.1rem 0 1.1rem 1.25rem;padding-left:1rem;
  border-left:2px solid var(--rule);color:var(--muted);
}
ul.items{margin:0 0 1.1rem;padding-left:1.25rem}
ul.items li{margin:.3rem 0}
table.bk{
  margin:1.2rem 0;border-collapse:collapse;width:100%;
  display:block;overflow-x:auto;max-width:100%;
}
table.bk th,table.bk td{overflow-wrap:anywhere}
#main{min-width:0}
.chapter{min-width:0;overflow-wrap:break-word}
table.bk th,table.bk td{
  border:1px solid var(--rule);padding:.45rem .6rem;vertical-align:top;
  text-align:left;font-size:.95rem;
}
table.bk th{font-variant:small-caps;letter-spacing:.03em}
.noteshr{border:none;border-top:1px solid var(--rule);margin:2.4rem 0 1rem}
.notes h4{font-variant:small-caps;letter-spacing:.06em;margin:0 0 .8rem}
.notes ol{margin:0;padding-left:1.4rem;font-size:.85rem;color:var(--muted)}
.notes li{margin:.35rem 0}
mark{background:var(--hit);color:inherit}
sup.fn{font-size:.72em;line-height:0}
sup.fn a{color:var(--accent);text-decoration:none;padding:0 .05em}
sup.fn a:hover{text-decoration:underline}
sup.fn a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.backref{font-size:.8em;text-decoration:none;color:var(--muted);margin-left:.25em}
.backref:hover{color:var(--accent)}
.notes li:target{background:var(--sel)}
table.bk th{background:var(--sel);font-weight:bold}
.front-lines p{margin:.6rem 0}
dl.abbr{display:grid;grid-template-columns:minmax(4.5rem,auto) 1fr;gap:.45rem 1.25rem;margin:1.2rem 0}
dl.abbr dt{font-weight:600;white-space:nowrap}
dl.abbr dd{margin:0}
@media (max-width:640px){dl.abbr{grid-template-columns:1fr;gap:.1rem 0}
dl.abbr dd{margin-bottom:.55rem}}
.bib p{margin:0 0 .55rem;text-indent:-1.2rem;padding-left:1.2rem}
.idx p{margin:0 0 .3rem}
.status{color:var(--muted);font-style:italic}
footer.site{
  border-top:1px solid var(--rule);padding:1rem;text-align:center;
  color:var(--muted);font-size:.85rem;
}

/* search results */
.results{max-width:40rem;margin:0 auto}
.results h2{font-variant:small-caps;letter-spacing:.04em}
.results .hitbox{
  border:1px solid var(--rule);border-radius:2px;padding:.7rem .9rem;margin:.7rem 0;
}
.results .hitbox a{color:var(--ink);font-weight:bold}
.results .hitbox a:hover{color:var(--accent);text-decoration:underline}
.results .where{font-size:.82rem;color:var(--muted);font-variant:small-caps;letter-spacing:.05em}
.results .frag{margin:.3rem 0 0;font-size:.95rem}

/* mobile: toc becomes an overlay panel */
#menuBtn{display:none}
@media (max-width:60rem){
  #menuBtn{display:inline-block}
  nav.toc{
    position:fixed;left:0;top:0;bottom:0;width:min(80vw,19rem);
    max-height:none;z-index:40;background:var(--paper);
    transform:translateX(-100%);transition:transform .25s ease;
    padding-top:1rem;box-shadow:4px 0 24px rgba(0,0,0,.22);
    border-right:1px solid var(--rule);
    /* reset the desktop flex-item rule so top:0/bottom:0 stretch the
       panel to the viewport; without this the drawer grows to content
       height and the list cannot scroll */
    align-self:auto;align-items:stretch;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  }
  nav.toc.open{transform:translateX(0)}
  .toc-scrim{
    position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:39;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .toc-scrim.show{opacity:1;pointer-events:auto}
  nav.toc .close-row{display:flex;justify-content:flex-end;margin-bottom:.4rem}
  main{padding:1.1rem .9rem 3rem}
  .layout{display:block}
}
nav.toc .close-row{display:none}
@media (max-width:60rem){nav.toc .close-row{display:flex}}

@media (prefers-reduced-motion:reduce){
  nav.toc{transition:none}
  *{scroll-behavior:auto}
}
html{scroll-behavior:smooth}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>

<header class="site">
  <button id="menuBtn" type="button" aria-expanded="false" aria-controls="toc">Contents</button>
  <p class="brand" style="margin:0"><a href="#" id="brandLink">Work of Human Hands</a></p>
  <div class="searchwrap" role="search">
    <label for="q" class="skip" style="position:absolute;left:-9999px">Search the book</label>
    <input id="q" type="search" placeholder="Search the book" autocomplete="off">
    <button id="searchBtn" type="button">Search</button>
  </div>
  <button id="themeBtn" type="button" aria-pressed="false">Dark</button>
</header>

<div class="layout">
  <div id="tocScrim" class="toc-scrim" hidden></div>
  <nav id="toc" class="toc" aria-label="Table of contents">
    <div class="close-row"><button id="tocClose" type="button" aria-label="Close contents">Close</button></div>
    <ol id="tocList"></ol>
  </nav>
  <main id="main" tabindex="-1">
    <div id="view" class="chapter" aria-live="polite">
      <p class="status">Loading the book...</p>
    </div>
  </main>
</div>

<footer class="site">
  <p style="margin:0">Work of Human Hands, 2nd ed. &copy; 2015 Anthony Cekada, SGG Resources. Text reproduced from the second edition for reference.</p>
</footer>

<script>
"use strict";
const BOOK_URL = "book.json";
let BOOK = null;

const view = document.getElementById("view");
const tocList = document.getElementById("tocList");
const q = document.getElementById("q");

function esc(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function unitLabel(u){
  if (u.kind === "chapter") return "Chapter " + u.number;
  if (u.kind === "preface") return "Preface";
  if (u.kind === "appendix") return "Appendix";
  return u.title;
}

function tocEntry(u, i){
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.href = "#unit-" + i;
  a.dataset.unit = String(i);
  const k = document.createElement("span");
  k.className = "kind";
  k.textContent = unitLabel(u);
  const t = document.createElement("span");
  t.textContent = u.kind === "front" ? u.title : (u.kind === "chapter" ? u.title : (u.kind === "bibliography" || u.kind === "index" ? u.title : u.title));
  a.append(k, document.createElement("br"), t);
  a.addEventListener("click", (e) => {
    e.preventDefault();
    showUnit(i);
    closeToc();
  });
  li.appendChild(a);
  return li;
}

const HDR_CELLS = new Set(["old text", "new text", "revised text",
  "traditional text", "traditional mass", "new mass", "roman canon", "text",
  "eucharistic prayers 1968,1969", "traditional text from the latin"]);

function withRefs(text, refs){
  // refs: [[charOffset, noteNumber], ...] ascending. Render each as a
  // superscript link to the note; the raw digits in the text are hidden
  // (they are the print's inline footnote markers).
  if (!refs || !refs.length) return esc(text);
  let out = "";
  let cursor = 0;
  refs.forEach(([pos, n], k) => {
    if (pos < cursor) return;                 // overlapping (backfilled)
    const s = String(n);
    const inText = text.startsWith(s, pos);
    const end = inText ? pos + s.length : pos;
    if (end < cursor || pos < cursor) return;
    out += esc(text.slice(cursor, pos));
    if (inText && k > 0 && text[pos - 1] === " " &&
        refs[k - 1] && text.startsWith(String(refs[k - 1][1]), pos - 1 - String(refs[k - 1][1]).length)) {
      // part of a split run like ".36 37": the leading space was already
      // emitted inside the previous slice - drop it
      out = out.replace(/ $/, "");
    }
    out += '<sup class="fn"><a href="#note-' + n + '" id="ref-' + n + '">' + n + "</a></sup>";
    cursor = end;
  });
  out += esc(text.slice(cursor));
  return out;
}

function blockHtml(b){
  if (b.t === "p") return "<p>" + withRefs(b.x, b.refs) + "</p>";
  if (b.t === "h3") return '<h3 class="sec" id="sec-' + b.x.length + "-" + (b._i || 0) + '">' + esc(b.x) + "</h3>";
  if (b.t === "quote") return '<p class="quote">' + withRefs(b.x, b.refs) + "</p>";
  if (b.t === "li") return null; // collected by caller
  if (b.t === "note") return null;
  if (b.t === "table") {
    // a row is a header row when its cells match the known header labels
    // (or the first row of a 2-col comparison)
    let h = '<table class="bk">';
    const rows = b.raw ? b.raw.rows : b.rows;
    rows.forEach((r, ri) => {
      const norm = c => c.trim().toLowerCase().replace(/\(.*\)$/, "").trim()
        .replace(/^\d{4}\s+/, "");
      const isHdr = r.length >= 2 && r.slice(0, 2).every(
        c => HDR_CELLS.has(norm(c)));
      h += "<tr>";
      r.forEach(c => {
        h += (isHdr ? "<th>" : "<td>") + esc(c) + (isHdr ? "</th>" : "</td>");
      });
      h += "</tr>";
    });
    return h + "</table>";
  }
  if (b.t === "front") return '<div class="front-lines">' + b.lines.map(l => "<p>" + esc(l) + "</p>").join("") + "</div>";
  if (b.t === "abbr") {
    return '<dl class="abbr">' + b.items.map(it =>
      "<dt>" + esc(it.ab) + "</dt><dd>" + esc(it.def) + "</dd>").join("") + "</dl>";
  }
  if (b.t === "bib") return "<p>" + esc(b.x) + "</p>";
  if (b.t === "idx") return "<p>" + esc(b.x) + "</p>";
  return "";
}

function renderUnit(u){
  let html = "";
  if (u.kind === "chapter") {
    html += '<p class="kicker">Chapter ' + u.number + "</p>";
    html += '<h1 class="chaptitle">' + esc(u.title) + "</h1>";
  } else if (u.kind !== "front") {
    html += '<h1 class="chaptitle">' + esc(u.title) + "</h1>";
  }
  // group consecutive li into ul; group notes into an end-of-chapter list
  const notes = [];
  let liBuf = [];
  const parts = [];
  u.content.forEach(b => {
    if (b.t === "li") { liBuf.push(b); return; }
    if (liBuf.length) { parts.push({t:"ul", items: liBuf}); liBuf = []; }
    if (b.t === "note") { notes.push(b); return; }
    parts.push(b);
  });
  if (liBuf.length) parts.push({t:"ul", items: liBuf});

  const wrap = u.kind === "bibliography" ? "bib" : (u.kind === "index" ? "idx" : "");
  html += '<div class="' + wrap + '">';
  parts.forEach((b, i) => {
    if (b.t === "ul") {
      html += '<ul class="items">' + b.items.map(it => "<li>" + withRefs(it.x, it.refs) + "</li>").join("") + "</ul>";
    } else {
      b._i = i;
      html += blockHtml(b);
    }
  });
  html += "</div>";
  if (notes.length) {
    html += '<hr class="noteshr"><section class="notes" id="notes"><h4>Notes to this chapter</h4><ol>';
    notes.forEach(n => {
      html += '<li id="note-' + n.n + '">' + esc(n.x) +
              ' <a class="backref" href="#ref-' + n.n + '" aria-label="Back to text">\u21a9</a></li>';
    });
    html += "</ol></section>";
  }
  return html;
}

let currentUnit = -1;
function showUnit(i){
  const u = BOOK.units[i];
  if (!u) return;
  currentUnit = i;
  view.innerHTML = renderUnit(u);
  view.className = "chapter";
  document.querySelectorAll("#tocList a").forEach(a => {
    a.classList.toggle("active", a.dataset.unit === String(i));
  });
  history.replaceState(null, "", "#unit-" + i);
  window.scrollTo(0, 0);
  document.getElementById("main").focus({preventScroll:true});
}

function showHome(){
  // title page: meta + start reading link
  const m = BOOK.meta;
  view.innerHTML =
    '<p class="kicker">' + esc(m.author) + "</p>" +
    '<h1 class="chaptitle">' + esc(m.title) + "</h1>" +
    '<p class="quote">' + esc(m.subtitle) + "</p>" +
    '<p>' + esc(m.edition) + ". " + esc(m.publisher) + ", " + esc(m.year) + ". ISBN " + esc(m.isbn) + ".</p>" +
    '<p><a href="#unit-6" id="startLink">Start reading: Author' + "'" + 's Preface</a></p>';
  view.className = "chapter";
  currentUnit = -1;
  document.querySelectorAll("#tocList a").forEach(a => a.classList.remove("active"));
  document.getElementById("startLink").addEventListener("click", (e) => {
    e.preventDefault();
    showUnit(6); // preface unit index
  });
  history.replaceState(null, "", location.pathname + location.search);
  window.scrollTo(0, 0);
}

/* search: case-insensitive substring across all text blocks */
function doSearch(){
  const term = q.value.trim();
  if (!BOOK) return;
  if (term.length < 2) {
    view.innerHTML = '<p class="status">Type at least two letters to search.</p>';
    view.className = "chapter";
    return;
  }
  const needle = term.toLowerCase();
  const hits = [];
  BOOK.units.forEach((u, ui) => {
    if (u.kind === "index") return; // index references pages of the print edition
    u.content.forEach(b => {
      if (b.t === "table") {
        const rows = b.raw ? b.raw.rows : b.rows;
        rows.forEach(r => {
          const joined = r.join(" ");
          if (joined.toLowerCase().includes(needle)) {
            hits.push({u: ui, where: unitLabel(u), frag: snippet(joined, needle)});
          }
        });
        return;
      }
      if (b.t === "abbr") {
        b.items.forEach(it => {
          const joined = it.ab + " " + it.def;
          if (joined.toLowerCase().includes(needle)) {
            hits.push({u: ui, where: unitLabel(u), frag: snippet(joined, needle)});
          }
        });
        return;
      }
      const x = b.x || (b.lines && b.lines.join(" ")) || "";
      if (!x) return;
      if (x.toLowerCase().includes(needle)) {
        hits.push({u: ui, where: unitLabel(u), frag: snippet(x, needle)});
      }
    });
  });
  let html = '<section class="results"><h2>' + hits.length + " result" + (hits.length === 1 ? "" : "s") +
    ' for &ldquo;' + esc(term) + "&rdquo;</h2>";
  if (hits.length === 0) {
    html += '<p class="status">No matches. Try another word or a shorter phrase.</p>';
  }
  const shown = hits.slice(0, 200);
  shown.forEach((h, i) => {
    html += '<div class="hitbox"><a href="#" data-hit="' + h.u + '">' + esc(BOOK.units[h.u].title) + "</a>" +
      ' <span class="where">' + esc(h.where) + "</span>" +
      '<p class="frag">' + h.frag + "</p></div>";
  });
  if (hits.length > shown.length) {
    html += '<p class="status">Showing the first ' + shown.length + " of " + hits.length + " matches.</p>";
  }
  html += "</section>";
  view.innerHTML = html;
  view.className = "";
  view.querySelectorAll("a[data-hit]").forEach(a => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      showUnit(Number(a.dataset.hit));
      // scroll to the first occurrence inside the unit
      const term2 = q.value.trim().toLowerCase();
      setTimeout(() => {
        const ps = view.querySelectorAll("p, li, h3");
        for (const p of ps) {
          if (p.textContent.toLowerCase().includes(term2)) {
            p.scrollIntoView({block: "center"});
            p.style.background = "var(--sel)";
            setTimeout(() => { p.style.background = ""; }, 1600);
            break;
          }
        }
      }, 50);
    });
  });
  window.scrollTo(0, 0);
}

function snippet(text, needle){
  const i = text.toLowerCase().indexOf(needle);
  const start = Math.max(0, i - 70);
  const end = Math.min(text.length, i + needle.length + 110);
  let s = (start > 0 ? "..." : "") + text.slice(start, end) + (end < text.length ? "..." : "");
  s = esc(s);
  const re = new RegExp("(" + needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return s.replace(re, "<mark>$1</mark>");
}

/* theme toggle */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(dark){
  document.documentElement.classList.toggle("dark", dark);
  themeBtn.textContent = dark ? "Light" : "Dark";
  themeBtn.setAttribute("aria-pressed", String(dark));
  try { localStorage.setItem("wohh-theme", dark ? "dark" : "light"); } catch(e){}
}
themeBtn.addEventListener("click", () => {
  applyTheme(!document.documentElement.classList.contains("dark"));
});
(function(){
  let saved = null;
  try { saved = localStorage.getItem("wohh-theme"); } catch(e){}
  const prefers = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved === "dark" || (saved !== "light" && prefers));
})();

/* mobile toc */
const toc = document.getElementById("toc");
const menuBtn = document.getElementById("menuBtn");
const scrim = document.getElementById("tocScrim");
function openToc(){
  toc.classList.add("open");
  scrim.hidden = false;
  requestAnimationFrame(() => scrim.classList.add("show"));
  menuBtn.setAttribute("aria-expanded", "true");
  toc.querySelector("a, button").focus();
}
function closeToc(){
  toc.classList.remove("open");
  scrim.classList.remove("show");
  setTimeout(() => { if (!toc.classList.contains("open")) scrim.hidden = true; }, 260);
  menuBtn.setAttribute("aria-expanded", "false");
}
menuBtn.addEventListener("click", () => {
  toc.classList.contains("open") ? closeToc() : openToc();
});
document.getElementById("tocClose").addEventListener("click", closeToc);
toc.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeToc(); menuBtn.focus(); } });
document.addEventListener("click", (e) => {
  if (toc.classList.contains("open") && !toc.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) closeToc();
  if (e.target === scrim) closeToc();
});

/* controls */
document.getElementById("searchBtn").addEventListener("click", doSearch);
q.addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch(); });
document.getElementById("brandLink").addEventListener("click", (e) => { e.preventDefault(); showHome(); });

/* boot */
window.addEventListener("hashchange", routeFromHash);
fetch(BOOK_URL)
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(book => {
    BOOK = book;
    BOOK.units.forEach((u, i) => tocList.appendChild(tocEntry(u, i)));
    routeFromHash();
  })
  .catch(err => {
    view.innerHTML = '<p class="status">Could not load book.json (' + esc(String(err)) +
      "). This site must be served over HTTP (for example: python3 -m http.server) rather than opened as a local file.</p>";
  });

function routeFromHash(){
  if (!BOOK) return;
  const hash = location.hash.match(/^#unit-(\d+)$/);
  if (hash && BOOK.units[Number(hash[1])]) {
    if (currentUnit !== Number(hash[1])) showUnit(Number(hash[1]));
  } else if (currentUnit === -1 || location.hash === "" || location.hash === "#") {
    showHome();
  }
}
</script>
</body>
</html>
